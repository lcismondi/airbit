; Airbit: ESP8266EX con flash de 4 MB, identificado en COM9.
[platformio]
default_envs = airbit_esp8266

[env:airbit_esp8266]
platform = espressif8266@4.2.1
board = nodemcuv2
framework = arduino
build_type = debug
debug_build_flags = -g3 -Os
board_build.flash_mode = dio
upload_port = COM9
upload_speed = 115200
monitor_port = COM9
monitor_speed = 115200
monitor_dtr = 0
monitor_rts = 0
monitor_filters = esp8266_exception_decoder, time, log2file
build_flags = -DDEBUG_ESP_OOM
lib_deps =
    adafruit/Adafruit BMP085 Library@1.2.4
    fastled/FastLED@3.6.0

; Binario publicable: no incluye valores privados de configuracion_local.h.
[env:airbit_release]
extends = env:airbit_esp8266
build_flags =
    ${env:airbit_esp8266.build_flags}
    -DAIRBIT_PUBLIC_RELEASE
